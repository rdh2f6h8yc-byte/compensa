<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Abrir Compensa</title><link rel="icon" href="/icon-192.png">
<style>
body{margin:0;background:#0f3d2e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.c{max-width:420px;padding:calc(28px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom));text-align:center}
img{width:84px;height:84px;border-radius:20px}
h1{font-size:26px;letter-spacing:-.5px;margin:18px 0 8px}
p{font-size:16px;line-height:1.5;opacity:.9;margin:0 0 22px}
a{display:block;border-radius:14px;padding:15px;font-weight:800;font-size:16px;text-decoration:none;margin-bottom:10px}
.app{background:#fff;color:#0f3d2e}.web{background:rgba(255,255,255,.12);color:#fff}
</style></head>
<body><div class="c">
<img src="/icon-192.png" alt="">
<h1 id="t">Abriendo Compensa…</h1>
<p id="m">Si no se abre sola, pulsa el botón.</p>
<a class="app" id="app" href="compensa://auth">Abrir la app Compensa</a>
<a class="web" id="web" href="/">Seguir en la web</a>
</div>
<script>
(function(){
  var h = location.hash || "", r = new URLSearchParams(location.search).get("r") || "";
  var q = new URLSearchParams(h.replace(/^#/, ""));
  var app = "compensa://auth" + h, web = "/" + h;
  document.getElementById("app").href = app;
  document.getElementById("web").href = web;
  if (q.get("error_description")) {
    document.getElementById("t").textContent = "Este enlace ya no vale";
    document.getElementById("m").textContent = "Ha caducado o ya se usó. Si ya confirmaste el correo, entra en la app con tu contraseña. Si no, pide otro enlace desde la app.";
    document.getElementById("app").href = "compensa://auth";
    document.getElementById("web").href = "/";
    return;
  }
  if (r === "confirmado") document.getElementById("t").textContent = "¡Correo confirmado!";
  if (r === "nueva") document.getElementById("t").textContent = "Pon tu nueva contraseña";
  // En iPhone o iPad se intenta abrir la app directamente
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (ios && q.get("access_token")) setTimeout(function(){ location.href = app; }, 250);
  else if (!ios) document.getElementById("m").textContent = "Abre este enlace en el iPhone donde tienes la app, o sigue en la web con tu cuenta.";
})();
</script>
</body></html>
